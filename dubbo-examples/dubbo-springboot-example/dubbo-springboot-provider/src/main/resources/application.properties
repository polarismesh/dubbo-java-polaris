# Spring Boot application
spring.application.name=dubbo-springboot-provider

# Dubbo application
dubbo.application.name=dubbo-springboot-provider
dubbo.application.register-mode=instance
dubbo.application.qosEnable=false
dubbo.application.metadata-type=remote

# Dubbo registry
dubbo.registry.address=polaris://9.135.147.8:8091

# Dubbo config center
dubbo.config-center.address=polaris://9.135.147.8:8093

# Dubbo metadata report
dubbo.metadata-report.address=polaris://9.135.147.8:8091

# Dubbo protocol
dubbo.protocol.name=dubbo
dubbo.protocol.port=20881

# Dubbo provider
dubbo.provider.token=true
dubbo.provider.filter=polaris_ratelimit

# Server port
server.port=15901